# =============================================================================
# Déploiement site-scraper (SSH → docker compose tgm-deploy)
# =============================================================================
# Secrets GitHub :
#   SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, DEPLOY_PATH
#   SSH_KEY_PASSPHRASE (ou SSH_PASSPHRASE) — si la clé privée est chiffrée
# Optionnel : SSH_PORT (défaut 22)
#
# Note : le paramètre `passphrase:` de appleboy/ssh-action est peu fiable.
# On déchiffre la clé sur le runner (pattern haystack) puis on passe key_path.
# =============================================================================

name: Deploy site-scraper (SSH + Docker)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-site-scraper-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check (compileall)
        run: python -m compileall -q app

      - name: Docker build
        run: docker build -t site-scraper:ci .

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - id: sshkey
        name: Préparer la clé SSH (déchiffrer si besoin)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          KEY="$HOME/.ssh/gh_deploy_site_scraper"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"
          chmod 600 "$KEY"

          PP="${SSH_KEY_PASSPHRASE:-${SSH_PASSPHRASE:-}}"
          if [ -n "$PP" ]; then
            ssh-keygen -p -f "$KEY" -P "$PP" -N "" -q
            echo "Clé déchiffrée pour cette exécution uniquement."
          else
            if ! timeout 8 ssh-keygen -y -f "$KEY" >/dev/null 2>&1; then
              echo "::error::SSH_PRIVATE_KEY est chiffrée : ajoute le secret SSH_KEY_PASSPHRASE (ou SSH_PASSPHRASE) avec la passphrase exacte de la clé."
              exit 1
            fi
            echo "Clé SSH sans passphrase (OK)."
          fi
          echo "key_path=$KEY" >> "$GITHUB_OUTPUT"

      - name: SSH — pull site-scraper + rebuild service site-scraper
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key_path: ${{ steps.sshkey.outputs.key_path }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            echo "=== Déploiement site-scraper ==="
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              echo "Erreur: secret DEPLOY_PATH vide (chemin tgm-deploy)"
              exit 1
            fi
            if [ ! -f "$DEPLOY_PATH/docker-compose.prod.yml" ]; then
              echo "Erreur: docker-compose.prod.yml introuvable dans DEPLOY_PATH=$DEPLOY_PATH"
              exit 1
            fi
            PARENT="$(cd "$DEPLOY_PATH/.." && pwd)"
            SS_DIR="$PARENT/site-scraper"
            if [ ! -d "$SS_DIR/.git" ]; then
              echo "Erreur: clone attendu à $SS_DIR"
              echo "  git clone git@github.com:ayaponcho/site-scraper.git $SS_DIR"
              exit 1
            fi
            echo "→ Mise à jour tgm-deploy…"
            cd "$DEPLOY_PATH"
            git fetch origin
            git checkout main 2>/dev/null || git checkout master 2>/dev/null || true
            git reset --hard origin/main 2>/dev/null || git reset --hard origin/master 2>/dev/null || true
            echo "→ Mise à jour code site-scraper…"
            cd "$SS_DIR"
            git fetch origin
            git checkout main 2>/dev/null || git checkout master 2>/dev/null || true
            git reset --hard origin/main 2>/dev/null || git reset --hard origin/master
            if [ ! -f "$SS_DIR/Dockerfile" ]; then
              echo "Erreur: Dockerfile introuvable dans $SS_DIR"
              exit 1
            fi
            cd "$DEPLOY_PATH"
            COMPOSE_FILE="docker-compose.prod.yml"
            DC=(docker compose -f "$COMPOSE_FILE")
            if [ -f ../.env ]; then
              DC=(docker compose --env-file ../.env -f "$COMPOSE_FILE")
            fi
            if ! "${DC[@]}" config --services 2>/dev/null | tr -d '\r' | grep -qx 'site-scraper'; then
              echo "Erreur: service site-scraper absent de docker-compose.prod.yml — mettre à jour tgm-deploy."
              exit 1
            fi
            echo "→ Docker: build + up site-scraper"
            "${DC[@]}" build --no-cache site-scraper
            "${DC[@]}" up -d site-scraper
            echo "→ Healthcheck interne…"
            sleep 5
            HEALTH=$(docker exec tgm-deploy-site-scraper python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8080/health').read().decode())" 2>/dev/null || true)
            echo "$HEALTH"
            echo "$HEALTH" | grep -q '"version"' && echo "✓ health avec version OK" || echo "⚠ ancienne image — rebuild site-scraper requis"
            echo "→ État :"
            "${DC[@]}" ps site-scraper
            echo "→ Reload nginx (proxy /site-scraper-api/)…"
            docker exec nginx nginx -s reload 2>/dev/null || true
            echo "=== Terminé ==="
