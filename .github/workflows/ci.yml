# =============================================================================
# CI site-scraper — vérif syntaxe Python + build Docker
# =============================================================================

name: CI

# Push main → uniquement deploy-ssh.yml (verify + déploiement).
# CI ici = filet de sécurité sur les PR avant merge.
on:
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check (compileall)
        run: python -m compileall -q app

      - name: Docker build
        run: docker build -t site-scraper:ci .
